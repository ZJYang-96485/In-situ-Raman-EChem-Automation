name: Deploy SpectraLoop to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "SpectraLoop/**"
      - ".github/workflows/deploy-spectraloop-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spectraloop-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload SpectraLoop application
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./SpectraLoop

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
